<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SplitLah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', 'monospace']
            },
            colors: {
              background: '#020617',
              surface: '#0f172a',
              checkpointGreen: '#23ff8d',
              checkpointPink: '#ff23b1',
              checkpointYellow: '#ffd823'
            },
            transitionTimingFunction: {
              'spring': 'cubic-bezier(0.35, 1.2, 0.35, 1)',
              'smooth': 'cubic-bezier(0.2, 0.8, 0.2, 1)',
              'ios': 'cubic-bezier(0.4, 0, 0.2, 1)'
            },
            animation: {
              'float': 'float 4s infinite ease-in-out',
              'tilt-slow': 'tilt 10s infinite linear',
              'scanline': 'scanline 8s linear infinite',
              'page-enter': 'pageEnter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards',
              'spring-up': 'springUp 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards',
              'app-reveal': 'appReveal 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'pulse-glow': 'pulseGlow 2s infinite ease-in-out'
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                '50%': { transform: 'translateY(-15px) rotate(2deg)' }
              },
              tilt: {
                '0%': { transform: 'perspective(1000px) rotateY(-5deg) rotateX(2deg)' },
                '50%': { transform: 'perspective(1000px) rotateY(5deg) rotateX(-2deg)' },
                '100%': { transform: 'perspective(1000px) rotateY(-5deg) rotateX(2deg)' }
              },
              scanline: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' }
              },
              pageEnter: {
                '0%': { transform: 'translate3d(0, 20px, 0) scale(0.98)', opacity: '0' },
                '100%': { transform: 'translate3d(0, 0, 0) scale(1)', opacity: '1' }
              },
              springUp: {
                '0%': { transform: 'translate3d(0, 40px, 0)', opacity: '0' },
                '100%': { transform: 'translate3d(0, 0, 0)', opacity: '1' }
              },
              pulseGlow: {
                '0%, 100%': { opacity: '0.5', transform: 'scale(1)' },
                '50%': { opacity: '1', transform: 'scale(1.05)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #000;
        color: white;
        overflow: hidden;
      }
      .grid-overlay {
        background-image: 
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      .pixel-border {
        box-shadow: 0 0 0 2px black, 0 0 0 4px currentColor;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      @keyframes agentFadeIn {
        0% { opacity: 0; transform: translateX(20px) scale(0.95); filter: blur(10px); }
        100% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
